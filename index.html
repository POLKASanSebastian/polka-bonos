<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi bono · POLKA</title>
<meta name="theme-color" content="#002FA7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bono POLKA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --papel:#FBF9F5; --crema:#F1ECE0; --superficie:#FFFFFF;
  --linea:#DFD8C8; --linea-fuerte:#C9C0AC;
  --tinta:#14162B; --gris:#63678A;
  --klein:#002FA7; --btn-bg:#002FA7; --btn-fg:#FFFFFF;
  --oro:#A8791C; --ok:#1B6B4F; --aviso:#8F5410; --alerta:#9C1F32;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --texto:"Karla","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--papel); color:var(--tinta); font-family:var(--texto);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance}
.topbar{
  background:var(--btn-bg); color:#fff;
  padding:calc(16px + env(safe-area-inset-top)) 18px 18px;
}
.marca{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.14em;line-height:1}
.marca span{display:block;font-family:var(--texto);font-weight:600;font-size:.68rem;
  letter-spacing:.16em;text-transform:uppercase;opacity:.78;margin-top:6px}
main{max-width:460px;margin:0 auto;padding:0 16px}

.ficha{
  background:var(--superficie); border:1px solid var(--linea); border-radius:14px;
  margin-top:-14px; box-shadow:0 1px 2px rgba(20,22,43,.06), 0 14px 34px -22px rgba(20,22,43,.4);
  overflow:hidden;
}
.ficha-cab{padding:18px 18px 14px; display:flex; justify-content:space-between; gap:14px; align-items:flex-start}
.ficha h1{font-size:1.25rem; font-weight:700; letter-spacing:-.01em}
.meta{font-size:.76rem; color:var(--gris); margin:5px 0 0; font-variant-numeric:tabular-nums}
.restantes{text-align:right;flex:none}
.restantes .n{font-family:var(--display);font-weight:800;font-size:3rem;line-height:.85;
  letter-spacing:-.035em;color:var(--klein);display:block;font-variant-numeric:tabular-nums}
.restantes .u{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gris);font-weight:600}
.agotado .restantes .n{color:var(--gris)}

.casillas{display:flex;flex-wrap:wrap;gap:5px;padding:2px 18px 0}
.cas{width:26px;height:26px;border-radius:4px;border:1.5px solid var(--linea-fuerte);
  display:grid;place-items:center;flex:none}
.cas.regalo{border-style:dashed;border-color:var(--oro)}
.cas.primera-regalo{margin-left:10px}
.cas.usada{background:var(--btn-bg);border-color:var(--btn-bg)}
.cas.usada.regalo{background:var(--oro);border-color:var(--oro);border-style:solid}
.cas svg{width:14px;height:14px;display:block}
.leyenda{font-size:.7rem;color:var(--gris);padding:9px 18px 0}
.leyenda b{color:var(--oro)}

.etiquetas{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.aviso{color:var(--aviso)}
.pill.alerta{color:var(--alerta)} .pill.neutro{color:var(--gris)}

.zona-qr{margin:18px 18px 0;padding:18px;background:var(--crema);
  border-radius:12px;text-align:center;border:1px solid var(--linea)}
.zona-qr h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);font-weight:700}
#qr{display:inline-block;margin:14px 0 10px;padding:12px;background:#fff;border-radius:10px;line-height:0}
#qr img,#qr canvas{display:block;width:180px;height:180px}
.zona-qr p{font-size:.8rem;color:var(--gris);margin:0}
.codigo{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:.9rem;
  color:var(--tinta);margin-top:10px}

.historial{border-top:1px solid var(--linea);margin-top:18px;padding:15px 18px}
.historial h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);font-weight:700}
.historial ol{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.historial li{display:flex;gap:10px;font-size:.84rem;font-variant-numeric:tabular-nums;align-items:baseline}
.historial li .idx{font-family:var(--display);font-weight:700;color:var(--klein);min-width:1.6em}
.historial .vacio{font-size:.84rem;color:var(--gris);margin:10px 0 0}

.condiciones{margin-top:22px;font-size:.78rem;color:var(--gris);line-height:1.65}
.condiciones h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);
  font-weight:700;margin-bottom:8px;font-family:var(--display)}
.condiciones ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.truco{margin-top:18px;background:var(--crema);border:1px solid var(--linea);
  border-radius:10px;padding:13px 15px;font-size:.83rem;color:var(--tinta)}
.truco b{font-weight:700}

.estado{padding:38px 18px;text-align:center;color:var(--gris)}
.estado h1{font-size:1.1rem;color:var(--tinta);margin-bottom:8px}
.estado p{font-size:.9rem;margin:0}
</style>
</head>
<body>

<header class="topbar">
  <div class="marca">POLKA<span>Bono de menú</span></div>
</header>

<main id="app">
  <div class="ficha"><div class="estado"><p>Cargando tu bono…</p></div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Motor de bonos en Cloudflare Workers */
var API = 'https://polka-bonos-api.inversportinver.workers.dev/';

(function () {
  var app = document.getElementById('app');

  function token() {
    var m = location.search.match(/[?&]b=([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }

  function urlBarra(t) {
    return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'barra.html?b=' + t;
  }

  function jsonp(params, cb) {
    var nombre = 'cbPolka' + Math.random().toString(36).slice(2);
    var s = document.createElement('script');
    var q = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    var listo = false;
    window[nombre] = function (d) { listo = true; limpia(); cb(d); };
    function limpia() { try { delete window[nombre]; } catch (e) {} if (s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = function () { if (!listo) { limpia(); cb({ ok: false, error: 'sin_conexion' }); } };
    setTimeout(function () { if (!listo) { limpia(); cb({ ok: false, error: 'sin_conexion' }); } }, 15000);
    s.src = API + (API.indexOf('?') === -1 ? '?' : '&') + q + '&callback=' + nombre;
    document.body.appendChild(s);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function eur(n) { return Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function fecha(iso) {
    if (!iso) return '';
    var d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
    return isNaN(d) ? '' : d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function fechaHora(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' · ' +
           d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }
  function diasHasta(f) {
    if (!f) return null;
    var d = new Date(f + 'T23:59:59');
    return isNaN(d) ? null : Math.ceil((d - new Date()) / 86400000);
  }

  var TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.3L13 4.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function aviso(titulo, texto) {
    app.innerHTML = '<div class="ficha"><div class="estado"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p></div></div>';
  }

  function pinta(b) {
    var d = diasHasta(b.caduca);
    var agotado = b.restantes === 0;
    var caducado = d !== null && d < 0;

    var casillas = '';
    for (var i = 0; i < b.total; i++) {
      var regalo = i >= b.pagadas;
      var usada = i < b.usadas;
      casillas += '<div class="cas' + (regalo ? ' regalo' : '') +
                  (regalo && i === b.pagadas ? ' primera-regalo' : '') +
                  (usada ? ' usada' : '') + '">' + (usada ? TICK : '') + '</div>';
    }

    var pills = '';
    if (b.estado === 'anulado') pills += '<span class="pill alerta">Bono anulado</span>';
    else if (agotado) pills += '<span class="pill neutro">Bono consumido</span>';
    else if (caducado) pills += '<span class="pill alerta">Caducó el ' + fecha(b.caduca) + '</span>';
    else if (d !== null && d <= 15) pills += '<span class="pill aviso">Caduca en ' + d + ' días</span>';
    else if (b.caduca) pills += '<span class="pill ok">Válido hasta ' + fecha(b.caduca) + '</span>';

    var hist = '';
    if (b.consumos.length) {
      hist = '<ol>';
      for (var j = b.consumos.length - 1; j >= 0; j--) {
        hist += '<li><span class="idx">' + (j + 1) + '</span><span>' + fechaHora(b.consumos[j].fecha) +
                (b.consumos[j].tipo === 'cortesia' ? ' · cortesía' : '') + '</span></li>';
      }
      hist += '</ol>';
    } else {
      hist = '<p class="vacio">Todavía no has usado ninguna comida.</p>';
    }

    app.innerHTML =
      '<div class="ficha' + (agotado ? ' agotado' : '') + '">' +
        '<div class="ficha-cab">' +
          '<div><h1>' + esc(b.nombre) + '</h1>' +
          '<p class="meta">Bono ' + b.pagadas + '+' + b.cortesia + ' · ' + eur(b.importe) +
          (b.compra ? ' · ' + fecha(b.compra) : '') + '</p></div>' +
          '<div class="restantes"><span class="n">' + b.restantes + '</span><span class="u">restantes</span></div>' +
        '</div>' +
        '<div class="casillas">' + casillas + '</div>' +
        '<div class="leyenda">' + b.pagadas + ' pagadas · <b>' + b.cortesia + ' de cortesía</b></div>' +
        (pills ? '<div class="etiquetas">' + pills + '</div>' : '') +
        '<div class="zona-qr">' +
          '<h2>Enséñalo al pedir</h2>' +
          '<div id="qr"></div>' +
          '<p>El equipo de POLKA lo escanea y te descuenta una comida.</p>' +
          '<div class="codigo">' + esc(b.token) + '</div>' +
        '</div>' +
        '<div class="historial"><h2>Tus comidas</h2>' + hist + '</div>' +
      '</div>' +
      '<div class="truco"><b>Tenlo siempre a mano:</b> abre el menú de tu navegador y elige ' +
        '«Añadir a pantalla de inicio». Te quedará como una app.</div>' +
      '<div class="condiciones"><h2>Condiciones</h2><ul>' +
        '<li>Válido para el Menú Polkero, de lunes a viernes de 12:30 a 16:00.</li>' +
        '<li>No disponible en festivos.</li>' +
        '<li>Suplementos de carta y el 10 % de servicio de terraza no están incluidos.</li>' +
        '<li>Bono nominal y no reembolsable.</li>' +
        (b.caduca ? '<li>Válido hasta el ' + fecha(b.caduca) + '.</li>' : '') +
      '</ul></div>';

    try {
      new QRCode(document.getElementById('qr'), {
        text: urlBarra(b.token),
        width: 180, height: 180,
        colorDark: '#14162B', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      document.getElementById('qr').innerHTML =
        '<div style="font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.2em;padding:26px 8px;line-height:1.4">' + esc(b.token) + '</div>';
      var dup = document.querySelector('.codigo');
      if (dup) dup.style.display = 'none';
    }
  }

  var t = token();
  if (!t) return aviso('Falta el enlace de tu bono', 'Abre el enlace que te mandó POLKA por WhatsApp.');

  jsonp({ action: 'bono', b: t }, function (r) {
    if (!r || !r.ok) {
      if (r && r.error === 'sin_conexion') return aviso('Sin conexión', 'No hemos podido cargar tu bono. Inténtalo otra vez en un momento.');
      return aviso('Bono no encontrado', 'Comprueba el enlace o pregunta en POLKA.');
    }
    pinta(r.bono);
  });
})();
</script>
</body>
</html>
