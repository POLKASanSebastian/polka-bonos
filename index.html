<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bono Polkero · POLKA</title>
<meta name="description" content="12 comidas del Menú Polkero por 189,50 €. El menú te sale a 15,79 €.">
<meta name="theme-color" content="#002FA7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bono POLKA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Karla:wght@400;500;600;700&display=swap">
<style>
:root{
  --papel:#FBF9F5; --crema:#F1ECE0; --superficie:#FFFFFF;
  --linea:#DFD8C8; --linea-fuerte:#C9C0AC;
  --tinta:#14162B; --gris:#63678A;
  --klein:#002FA7; --btn-bg:#002FA7; --btn-fg:#FFFFFF;
  --oro:#A8791C; --ok:#1B6B4F; --aviso:#8F5410; --alerta:#9C1F32;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --texto:"Karla","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--papel); color:var(--tinta); font-family:var(--texto);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}
h1,h2,h3{font-family:var(--display); margin:0; text-wrap:balance}
a{color:var(--klein)}

.topbar{
  background:var(--btn-bg); color:#fff;
  padding:calc(16px + env(safe-area-inset-top)) 18px 18px;
}
.marca{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.14em;line-height:1}
.marca span{display:block;font-family:var(--texto);font-weight:600;font-size:.68rem;
  letter-spacing:.16em;text-transform:uppercase;opacity:.78;margin-top:6px}
main{max-width:460px;margin:0 auto;padding:0 16px}

.ficha{
  background:var(--superficie); border:1px solid var(--linea); border-radius:14px;
  margin-top:-14px; box-shadow:0 1px 2px rgba(20,22,43,.06), 0 14px 34px -22px rgba(20,22,43,.4);
  overflow:hidden;
}
.ficha-cab{padding:18px 18px 14px; display:flex; justify-content:space-between; gap:14px; align-items:flex-start}
.ficha h1{font-size:1.25rem; font-weight:700; letter-spacing:-.01em}
.meta{font-size:.76rem; color:var(--gris); margin:5px 0 0; font-variant-numeric:tabular-nums}
.restantes{text-align:right;flex:none}
.restantes .n{font-family:var(--display);font-weight:800;font-size:3rem;line-height:.85;
  letter-spacing:-.035em;color:var(--klein);display:block;font-variant-numeric:tabular-nums}
.restantes .u{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--gris);font-weight:600}
.agotado .restantes .n{color:var(--gris)}

.casillas{display:flex;flex-wrap:wrap;gap:5px;padding:2px 18px 0}
.cas{width:26px;height:26px;border-radius:4px;border:1.5px solid var(--linea-fuerte);
  display:grid;place-items:center;flex:none}
.cas.regalo{border-style:dashed;border-color:var(--oro)}
.cas.primera-regalo{margin-left:10px}
.cas.usada{background:var(--btn-bg);border-color:var(--btn-bg)}
.cas.usada.regalo{background:var(--oro);border-color:var(--oro);border-style:solid}
.cas svg{width:14px;height:14px;display:block}
.leyenda{font-size:.7rem;color:var(--gris);padding:9px 18px 0}
.leyenda b{color:var(--oro)}

.etiquetas{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.aviso{color:var(--aviso)}
.pill.alerta{color:var(--alerta)} .pill.neutro{color:var(--gris)}

.zona-qr{margin:18px 18px 0;padding:18px;background:var(--crema);
  border-radius:12px;text-align:center;border:1px solid var(--linea)}
.zona-qr h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);font-weight:700}
#qr{display:inline-block;margin:14px 0 10px;padding:12px;background:#fff;border-radius:10px;line-height:0}
#qr img,#qr canvas{display:block;width:180px;height:180px}
.zona-qr p{font-size:.8rem;color:var(--gris);margin:0}
.codigo{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:.9rem;
  color:var(--tinta);margin-top:10px}

.historial{border-top:1px solid var(--linea);margin-top:18px;padding:15px 18px}
.historial h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);font-weight:700}
.historial ol{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.historial li{display:flex;gap:10px;font-size:.84rem;font-variant-numeric:tabular-nums;align-items:baseline}
.historial li .idx{font-family:var(--display);font-weight:700;color:var(--klein);min-width:1.6em}
.historial .vacio{font-size:.84rem;color:var(--gris);margin:10px 0 0}

.condiciones{margin-top:22px;font-size:.78rem;color:var(--gris);line-height:1.65}
.condiciones h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);
  font-weight:700;margin-bottom:8px;font-family:var(--display)}
.condiciones ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.truco{margin-top:18px;background:var(--crema);border:1px solid var(--linea);
  border-radius:10px;padding:13px 15px;font-size:.83rem;color:var(--tinta)}
.truco b{font-weight:700}

.estado{padding:38px 18px;text-align:center;color:var(--gris)}
.estado h1{font-size:1.1rem;color:var(--tinta);margin-bottom:8px}
.estado p{font-size:.9rem;margin:0}

.hero{background:var(--btn-bg);color:#fff;padding:0 18px 34px;margin-bottom:0}
.hero h1{font-size:2rem;line-height:1.08;letter-spacing:-.025em;font-weight:800}
.hero h1 em{font-style:normal;color:#F1ECE0;display:block}
.hero p{font-size:1rem;margin:16px 0 0;opacity:.9;max-width:30ch}

.precio{
  background:var(--superficie);border:1px solid var(--linea);border-radius:14px;
  margin-top:-20px;padding:22px 20px;
  box-shadow:0 1px 2px rgba(20,22,43,.06), 0 16px 36px -24px rgba(20,22,43,.45);
}
.precio .grande{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.precio .euros{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;
  letter-spacing:-.035em;color:var(--klein);font-variant-numeric:tabular-nums}
.precio .porque{font-size:.9rem;color:var(--gris)}
.precio .desglose{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.precio .desglose li{display:flex;justify-content:space-between;gap:12px;font-size:.93rem;
  border-bottom:1px dashed var(--linea);padding-bottom:9px}
.precio .desglose li:last-child{border-bottom:0;padding-bottom:0}
.precio .desglose b{font-variant-numeric:tabular-nums;font-weight:700}
.precio .desglose .destaca b{color:var(--oro)}
.precio .anual{margin:16px 0 0;font-size:.84rem;color:var(--gris);line-height:1.55}

.cta{
  display:block;width:100%;text-align:center;text-decoration:none;
  background:#25D366;color:#0B2E17;font-family:var(--display);font-weight:800;
  font-size:1.05rem;padding:17px 18px;border-radius:11px;margin-top:20px;
  border:1px solid #1FB457;letter-spacing:.01em;
}
.cta-nota{text-align:center;font-size:.8rem;color:var(--gris);margin:10px 0 0}

.bloque{margin-top:34px}
.bloque > h2{font-size:1.25rem;letter-spacing:-.015em;margin-bottom:6px}
.bloque > p.intro{color:var(--gris);font-size:.93rem;margin:0 0 16px}

.pasos{margin:0;padding:0;list-style:none;counter-reset:paso;display:flex;flex-direction:column;gap:14px}
.pasos li{display:flex;gap:14px;align-items:flex-start}
.pasos li::before{
  counter-increment:paso;content:counter(paso);
  font-family:var(--display);font-weight:800;font-size:.85rem;
  background:var(--klein);color:#fff;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;flex:none;margin-top:2px;
}
.pasos b{display:block;font-weight:700}
.pasos span{font-size:.9rem;color:var(--gris)}

.mockup{
  background:var(--crema);border:1px solid var(--linea);border-radius:14px;
  padding:20px 18px;text-align:center;margin-top:18px;
}
.mockup .movil{
  width:190px;margin:0 auto;background:var(--superficie);border:1px solid var(--linea-fuerte);
  border-radius:16px;padding:12px 12px 14px;text-align:left;
  box-shadow:0 10px 26px -18px rgba(20,22,43,.6);
}
.mockup .m-cab{background:var(--btn-bg);color:#fff;border-radius:8px;padding:7px 9px;
  font-family:var(--display);font-weight:800;font-size:.6rem;letter-spacing:.12em}
.mockup .m-fila{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.mockup .m-nom{font-weight:700;font-size:.78rem}
.mockup .m-n{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--klein);line-height:1}
.mockup .m-cas{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.mockup .m-cas i{width:13px;height:13px;border-radius:3px;border:1.2px solid var(--linea-fuerte);display:block}
.mockup .m-cas i.on{background:var(--btn-bg);border-color:var(--btn-bg)}
.mockup .m-cas i.reg{border-style:dashed;border-color:var(--oro)}
.mockup .m-qr{margin:11px auto 0;width:76px;height:76px;line-height:0;
  border:5px solid #fff;border-radius:6px;box-shadow:0 0 0 1px var(--linea);background:#fff}
.mockup .m-qr img,.mockup .m-qr canvas{width:76px;height:76px;display:block}
.mockup p{font-size:.8rem;color:var(--gris);margin:14px 0 0}

.carta{background:var(--superficie);border:1px solid var(--linea);border-radius:12px;padding:18px}
.carta h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gris);
  font-weight:700;margin-bottom:9px}
.carta ul{margin:0 0 16px;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:.93rem}
.carta ul:last-of-type{margin-bottom:0}
.carta .incluye{margin-top:16px;padding-top:14px;border-top:1px solid var(--linea);
  font-size:.87rem;color:var(--gris)}
.carta .incluye b{color:var(--tinta)}

.dudas{margin:0;padding:0}
.dudas dt{font-weight:700;margin-top:16px;font-size:.97rem}
.dudas dt:first-child{margin-top:0}
.dudas dd{margin:5px 0 0;color:var(--gris);font-size:.92rem}

.condi-landing{background:var(--crema);border:1px solid var(--linea);border-radius:12px;
  padding:17px 18px;font-size:.88rem;color:var(--gris)}
.condi-landing h2{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;
  color:var(--gris);font-weight:700;margin-bottom:10px}
.condi-landing ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}

.donde{margin-top:34px;border-top:1px solid var(--linea);padding-top:18px;
  font-size:.88rem;color:var(--gris);line-height:1.7}
.donde b{color:var(--tinta);font-family:var(--display);font-weight:700;
  font-size:1rem;display:block;margin-bottom:4px}
</style>
</head>
<body>

<header class="topbar" id="cabecera">
  <div class="marca">POLKA<span>Bono de menú</span></div>
</header>

<main id="app">
  <div class="ficha"><div class="estado"><p>Cargando…</p></div></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Motor de bonos en Cloudflare Workers */
var API = 'https://polka-bonos-api.inversportinver.workers.dev/';
/* Teléfono de WhatsApp de POLKA, con prefijo y sin espacios */
var WHATSAPP = '34607420835';

(function () {
  var app = document.getElementById('app');

  function token() {
    var m = location.search.match(/[?&]b=([A-Za-z0-9_-]+)/);
    return m ? m[1] : '';
  }

  function urlBarra(t) {
    return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'barra.html?b=' + t;
  }

  function jsonp(params, cb) {
    var nombre = 'cbPolka' + Math.random().toString(36).slice(2);
    var s = document.createElement('script');
    var q = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    var listo = false;
    window[nombre] = function (d) { listo = true; limpia(); cb(d); };
    function limpia() { try { delete window[nombre]; } catch (e) {} if (s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = function () { if (!listo) { limpia(); cb({ ok: false, error: 'sin_conexion' }); } };
    setTimeout(function () { if (!listo) { limpia(); cb({ ok: false, error: 'sin_conexion' }); } }, 15000);
    s.src = API + (API.indexOf('?') === -1 ? '?' : '&') + q + '&callback=' + nombre;
    document.body.appendChild(s);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function eur(n) { return Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function fecha(iso) {
    if (!iso) return '';
    var d = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso);
    return isNaN(d) ? '' : d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function fechaHora(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' · ' +
           d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }
  function diasHasta(f) {
    if (!f) return null;
    var d = new Date(f + 'T23:59:59');
    return isNaN(d) ? null : Math.ceil((d - new Date()) / 86400000);
  }

  var TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.3L13 4.8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function aviso(titulo, texto) {
    app.innerHTML = '<div class="ficha"><div class="estado"><h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p></div></div>';
  }

  function enlaceWhatsApp() {
    var t = 'Hola! Me interesa el Bono Polkero (12 comidas por 189,50 €). ¿Cómo lo hacemos?';
    return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t);
  }

  function casillasMockup() {
    var out = '';
    for (var i = 0; i < 12; i++) {
      out += '<i class="' + (i < 5 ? 'on' : '') + (i >= 10 ? ' reg' : '') + '"></i>';
    }
    return out;
  }

  function pintaLanding() {
    document.querySelector('#cabecera .marca span').textContent = 'Bono Polkero';
    var wa = enlaceWhatsApp();

    app.innerHTML =
      '<section class="hero">' +
        '<h1>Come en la Parte Vieja<em>por 15,79 € al día</em></h1>' +
        '<p>El Menú Polkero de siempre. Lo pagas por adelantado y te sale más barato.</p>' +
      '</section>' +

      '<section class="precio">' +
        '<div class="grande"><span class="euros">189,50 €</span>' +
          '<span class="porque">12 comidas</span></div>' +
        '<ul class="desglose">' +
          '<li><span>10 comidas pagadas</span><b>189,50 €</b></li>' +
          '<li class="destaca"><span>2 comidas de cortesía</span><b>invitamos</b></li>' +
          '<li><span>Te sale el menú a</span><b>15,79 €</b></li>' +
          '<li><span>En vez de</span><b>18,95 €</b></li>' +
        '</ul>' +
        '<p class="anual">Es un 16,7 % menos. Si comes aquí a diario, ronda los 900 € al año.</p>' +
        '<a class="cta" href="' + esc(wa) + '" target="_blank" rel="noopener">Lo quiero · escríbenos</a>' +
        '<p class="cta-nota">O pídelo directamente en barra.</p>' +
      '</section>' +

      '<section class="bloque">' +
        '<h2>¿Es para ti?</h2>' +
        '<p class="intro">Si comes en POLKA <b>dos o más veces por semana</b>, sí. ' +
        'Si vienes de vez en cuando, te sale mejor pagar el menú suelto y no atarte a nada. ' +
        'Preferimos decírtelo antes que después.</p>' +
      '</section>' +

      '<section class="bloque">' +
        '<h2>Cómo funciona</h2>' +
        '<ol class="pasos">' +
          '<li><span><b>Lo pagas una vez</b><span>En barra o como te venga mejor.</span></span></li>' +
          '<li><span><b>Te llega tu tarjeta al móvil</b><span>Un enlace por WhatsApp. Lo guardas en la pantalla de inicio y te queda como una app.</span></span></li>' +
          '<li><span><b>La enseñas al pedir</b><span>Escaneamos tu código y descontamos una comida. Tú ves cuántas te quedan.</span></span></li>' +
        '</ol>' +
        '<div class="mockup">' +
          '<div class="movil">' +
            '<div class="m-cab">POLKA</div>' +
            '<div class="m-fila"><span class="m-nom">Tu nombre</span><span class="m-n">7</span></div>' +
            '<div class="m-cas">' + casillasMockup() + '</div>' +
            '<div class="m-qr" id="m-qr"></div>' +
          '</div>' +
          '<p>Sin cartulinas que se pierden. Sin apps que instalar.</p>' +
        '</div>' +
      '</section>' +

      '<section class="bloque">' +
        '<h2>Qué se come</h2>' +
        '<p class="intro">Cuatro primeros y seis segundos a elegir, todos los días. ' +
        'No es el mismo plato dos veces por semana.</p>' +
        '<div class="carta">' +
          '<h3>Primeros</h3>' +
          '<ul>' +
            '<li>Ensalada de pasta</li>' +
            '<li>La Polka Rusa</li>' +
            '<li>Tomate marinera con burrata</li>' +
            '<li>Polke Salmón Bowl</li>' +
          '</ul>' +
          '<h3>Segundos</h3>' +
          '<ul>' +
            '<li>Txerri Pulled Bun</li>' +
            '<li>Santo Tomás · tako talo</li>' +
            '<li>Chicken Burger 1838</li>' +
            '<li>Carne guisada con tomate</li>' +
            '<li>Txipirones «Pelatinta»</li>' +
            '<li>Lomo de bakalao «Chipo-arriero»</li>' +
          '</ul>' +
          '<p class="incluye"><b>Incluido:</b> pan, bebida (agua, copa de vino, caña o refresco) y café o infusión.</p>' +
        '</div>' +
      '</section>' +

      '<section class="bloque">' +
        '<h2>Lo que sueles preguntar</h2>' +
        '<dl class="dudas">' +
          '<dt>¿Y si algún día no vengo?</dt>' +
          '<dd>No pasa nada. El bono no caduca cada mes: tienes tres meses para gastarlo, ' +
          'y comiendo dos veces por semana te sobra tiempo.</dd>' +
          '<dt>¿Y si me dejo el móvil o se me olvida?</dt>' +
          '<dd>Te buscamos por tu nombre. La tarjeta es una comodidad, no una condición.</dd>' +
          '<dt>¿Puedo invitar a alguien?</dt>' +
          '<dd>Sí. Se gastan dos comidas de tu bono y ya está.</dd>' +
          '<dt>¿Puedo pagar el suplemento de un plato?</dt>' +
          '<dd>Claro. El bono cubre el menú; los suplementos se pagan aparte, como siempre.</dd>' +
        '</dl>' +
      '</section>' +

      '<section class="bloque">' +
        '<div class="condi-landing">' +
          '<h2>Condiciones, claras</h2>' +
          '<ul>' +
            '<li>Válido para el Menú Polkero, de lunes a viernes de 12:30 a 16:00.</li>' +
            '<li>No disponible en festivos.</li>' +
            '<li>Suplementos de carta y el 10 % de servicio de terraza no están incluidos.</li>' +
            '<li>Bono nominal y no reembolsable.</li>' +
            '<li>Tres meses de validez desde la compra.</li>' +
          '</ul>' +
        '</div>' +
        '<a class="cta" href="' + esc(wa) + '" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>' +
      '</section>' +

      '<div class="donde">' +
        '<b>POLKA</b>' +
        'Sarriegi Plaza 7 · Parte Vieja · Donostia-San Sebastián<br>' +
        'Menú Polkero de lunes a viernes, 12:30 a 16:00.' +
      '</div>';

    try {
      new QRCode(document.getElementById('m-qr'), {
        text: location.origin + location.pathname,
        width: 76, height: 76,
        colorDark: '#14162B', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch (e) {}
  }

  function pinta(b) {
    var d = diasHasta(b.caduca);
    var agotado = b.restantes === 0;
    var caducado = d !== null && d < 0;

    var casillas = '';
    for (var i = 0; i < b.total; i++) {
      var regalo = i >= b.pagadas;
      var usada = i < b.usadas;
      casillas += '<div class="cas' + (regalo ? ' regalo' : '') +
                  (regalo && i === b.pagadas ? ' primera-regalo' : '') +
                  (usada ? ' usada' : '') + '">' + (usada ? TICK : '') + '</div>';
    }

    var pills = '';
    if (b.estado === 'anulado') pills += '<span class="pill alerta">Bono anulado</span>';
    else if (agotado) pills += '<span class="pill neutro">Bono consumido</span>';
    else if (caducado) pills += '<span class="pill alerta">Caducó el ' + fecha(b.caduca) + '</span>';
    else if (d !== null && d <= 15) pills += '<span class="pill aviso">Caduca en ' + d + ' días</span>';
    else if (b.caduca) pills += '<span class="pill ok">Válido hasta ' + fecha(b.caduca) + '</span>';

    var hist = '';
    if (b.consumos.length) {
      hist = '<ol>';
      for (var j = b.consumos.length - 1; j >= 0; j--) {
        hist += '<li><span class="idx">' + (j + 1) + '</span><span>' + fechaHora(b.consumos[j].fecha) +
                (b.consumos[j].tipo === 'cortesia' ? ' · cortesía' : '') + '</span></li>';
      }
      hist += '</ol>';
    } else {
      hist = '<p class="vacio">Todavía no has usado ninguna comida.</p>';
    }

    app.innerHTML =
      '<div class="ficha' + (agotado ? ' agotado' : '') + '">' +
        '<div class="ficha-cab">' +
          '<div><h1>' + esc(b.nombre) + '</h1>' +
          '<p class="meta">Bono ' + b.pagadas + '+' + b.cortesia + ' · ' + eur(b.importe) +
          (b.compra ? ' · ' + fecha(b.compra) : '') + '</p></div>' +
          '<div class="restantes"><span class="n">' + b.restantes + '</span><span class="u">restantes</span></div>' +
        '</div>' +
        '<div class="casillas">' + casillas + '</div>' +
        '<div class="leyenda">' + b.pagadas + ' pagadas · <b>' + b.cortesia + ' de cortesía</b></div>' +
        (pills ? '<div class="etiquetas">' + pills + '</div>' : '') +
        '<div class="zona-qr">' +
          '<h2>Enséñalo al pedir</h2>' +
          '<div id="qr"></div>' +
          '<p>El equipo de POLKA lo escanea y te descuenta una comida.</p>' +
          '<div class="codigo">' + esc(b.token) + '</div>' +
        '</div>' +
        '<div class="historial"><h2>Tus comidas</h2>' + hist + '</div>' +
      '</div>' +
      '<div class="truco"><b>Tenlo siempre a mano:</b> abre el menú de tu navegador y elige ' +
        '«Añadir a pantalla de inicio». Te quedará como una app.</div>' +
      '<div class="condiciones"><h2>Condiciones</h2><ul>' +
        '<li>Válido para el Menú Polkero, de lunes a viernes de 12:30 a 16:00.</li>' +
        '<li>No disponible en festivos.</li>' +
        '<li>Suplementos de carta y el 10 % de servicio de terraza no están incluidos.</li>' +
        '<li>Bono nominal y no reembolsable.</li>' +
        (b.caduca ? '<li>Válido hasta el ' + fecha(b.caduca) + '.</li>' : '') +
      '</ul></div>';

    try {
      new QRCode(document.getElementById('qr'), {
        text: urlBarra(b.token),
        width: 180, height: 180,
        colorDark: '#14162B', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (e) {
      document.getElementById('qr').innerHTML =
        '<div style="font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.2em;padding:26px 8px;line-height:1.4">' + esc(b.token) + '</div>';
      var dup = document.querySelector('.codigo');
      if (dup) dup.style.display = 'none';
    }
  }

  var t = token();
  if (!t) return pintaLanding();

  jsonp({ action: 'bono', b: t }, function (r) {
    if (!r || !r.ok) {
      if (r && r.error === 'sin_conexion') return aviso('Sin conexión', 'No hemos podido cargar tu bono. Inténtalo otra vez en un momento.');
      return aviso('Bono no encontrado', 'Comprueba el enlace o pregunta en POLKA.');
    }
    pinta(r.bono);
  });
})();
</script>
</body>
</html>
